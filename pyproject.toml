[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous code agent: reasoning, code generation and sandboxed execution"
readme = "README.md"
requires-python = "==3.10.*"

dependencies = [
    "pydantic>=2.0",
    "mcp>=1.22,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sandbox = "sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "sandbox", "agent_mbpp", "agent_swebench", "mcp_tools"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"core/constants.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"
